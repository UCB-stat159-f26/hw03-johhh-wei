[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tenniscareer"
version = "0.1.0"
description = "Get a tennis player's career matches from tennisabstract.com and plot age vs. age gap to opponents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yiwei Zhao" }]
dependencies = ["pandas>=1.5", "matplotlib>=3.5", "requests>=2.25"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
